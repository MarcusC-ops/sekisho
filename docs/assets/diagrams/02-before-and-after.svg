<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Why the check happens before signing</title><desc id="desc">Without a pre-signing check an agent transfers money before a risk is noticed. With Sekisho risk signals and rules inform whether the payment proceeds, is held or is blocked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#191817"/></marker></defs><rect width="1600" height="900" fill="#F0EBE6"/><text x="72" y="112" fill="#191817" font-size="62" font-weight="700" font-family="Arial,Helvetica,sans-serif">Timing changes what you can do</text><text x="74" y="170" fill="#625E59" font-size="28" font-weight="400" font-family="Arial,Helvetica,sans-serif">A conceptual comparison of payment flows with and without a pre-signing check.</text><text x="74" y="258" fill="#9D3435" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif">Without a pre-signing check</text><rect x="74" y="300" width="410" height="150" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="99" y="359" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Payment request</text><text x="99" y="414" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">The agent acts</text><rect x="595" y="300" width="410" height="150" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="620" y="359" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Signature + transfer</text><text x="620" y="414" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Money leaves the wallet</text><rect x="1116" y="300" width="410" height="150" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="1141" y="359" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Risk noticed later</text><text x="1141" y="414" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Recovery may be difficult</text><path d="M484 375 L580 375" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1005 375 L1100 375" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="74" y="552" fill="#236247" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif">With Sekisho in the payment path</text><rect x="74" y="594" width="410" height="150" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="99" y="653" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Payment request</text><text x="99" y="708" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">The agent asks to pay</text><rect x="595" y="594" width="410" height="150" rx="20" fill="#D8C7F1" stroke="#191817" stroke-width="2"/><text x="620" y="653" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Check before signing</text><text x="620" y="708" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Risk signals + policy</text><rect x="1116" y="594" width="410" height="150" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="1141" y="653" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">A controlled next step</text><text x="1141" y="708" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Proceed, hold or block</text><path d="M484 669 L580 669" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1005 669 L1100 669" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="74" y="830" fill="#625E59" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Screening can surface known risks. It cannot guarantee a recipient is trustworthy.</text></svg>