<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Risks and the controls Sekisho contributes</title><desc id="desc">Recipient risk calls for screening. Suspicious activity calls for review. Decision accountability calls for evidence. Obligations depend on jurisdiction. Sekisho is not a complete compliance programme.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#191817"/></marker></defs><rect width="1600" height="900" fill="#F0EBE6"/><text x="72" y="110" fill="#191817" font-size="58" font-weight="700" font-family="Arial,Helvetica,sans-serif">Why payment teams need the evidence</text><text x="74" y="170" fill="#625E59" font-size="28" font-weight="400" font-family="Arial,Helvetica,sans-serif">The customer wants a payment to work. The institution must also understand the risk.</text><text x="74" y="260" fill="#625E59" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">WHAT CAN GO WRONG</text><text x="955" y="260" fill="#625E59" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">WHAT SEKISHO CONTRIBUTES</text><rect x="74" y="306" width="770" height="118" rx="20" fill="#F2D4D4" stroke="#191817" stroke-width="2"/><text x="102" y="350" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Recipient risk</text><text x="102" y="393" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">A payment may involve a prohibited party.</text><path d="M844 365 L932 365" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="961" y="374" fill="#191817" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">Screen before signing</text><rect x="74" y="456" width="770" height="118" rx="20" fill="#F4E1AE" stroke="#191817" stroke-width="2"/><text x="102" y="500" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Suspicious activity</text><text x="102" y="543" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">Wallet activity may need investigation.</text><path d="M844 515 L932 515" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="961" y="524" fill="#191817" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">Route uncertainty to review</text><rect x="74" y="606" width="770" height="118" rx="20" fill="#D8C7F1" stroke="#191817" stroke-width="2"/><text x="102" y="650" fill="#191817" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">Decision accountability</text><text x="102" y="693" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">A reviewer needs to know what happened.</text><path d="M844 665 L932 665" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="961" y="674" fill="#191817" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">Keep reasons + policy + record</text><text x="74" y="810" fill="#625E59" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Potential consequences include investigations, remediation work and, where rules are breached, penalties.</text><text x="74" y="845" fill="#625E59" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Requirements depend on jurisdiction and activity. Sekisho supports a workflow; it is not a complete compliance programme.</text></svg>