<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sekisho icons and lockups</title>
<!-- Rendered by capture.cjs with ?size=N and a variant hash:
     #icon (rounded mark), #full (full-bleed app icon), #maskable (PWA safe zone),
     #lockup and #lockup-dark (logo, name and kanji on a transparent background). -->
<style>
@font-face { font-family: 'Inter Tight'; src: url('fonts/inter-tight-latin-wght-normal.woff2'); font-weight: 100 900; }
html, body { margin: 0; background: transparent; }
svg { display: block; width: 100%; height: 100%; }
.lockup { display: inline-flex; align-items: center; gap: 14px; padding: 12px; font-family: 'Inter Tight', Arial, sans-serif; color: #191817; }
.lockup svg { width: 56px; height: 56px; }
.name { font-size: 40px; font-weight: 680; letter-spacing: -1.4px; }
.kanji { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 30px; color: #625e59; border-left: 1px solid #c9c1b8; padding-left: 18px; margin-left: 4px; }
.dark { color: #faf8f5; } .dark .kanji { color: #d8cfc6; border-color: #625e59; }
</style>
</head>
<body>
<div id="art"></div>
<script>
// Geometry matches ../logo.svg; full-bleed variants scale the artwork into platform safe zones.
const variant = location.hash.slice(1) || 'icon';
const size = Number(new URLSearchParams(location.search).get('size')) || 64;
const mark = '<path d="M17 16v34M47 16v34" stroke="#fff" stroke-width="5" stroke-linecap="round"/>' +
  '<path d="M11 22h42M14 31h36" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>';
const frame = '<rect x="5" y="5" width="54" height="54" rx="6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>';
const svg = (rx, inner, scale) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="${rx}" fill="#1b3f8f"/>
  <g transform="translate(32 32) scale(${scale}) translate(-32 -32)">${inner}</g></svg>`;
const art = document.getElementById('art');
if (variant.startsWith('lockup')) {
  art.className = 'lockup' + (variant === 'lockup-dark' ? ' dark' : '');
  art.innerHTML = svg(10, frame + mark, 1) +
    '<span class="name">Sekisho</span><span class="kanji" lang="ja">関所</span>';
} else {
  art.style.width = art.style.height = size + 'px';
  art.innerHTML = variant === 'full' ? svg(0, frame + mark, 0.8)
    : variant === 'maskable' ? svg(0, mark, 0.8)
    : svg(10, frame + mark, 1);
}
</script>
</body>
</html>
