<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sekisho presentation artwork</title>
<style>
@font-face { font-family: 'Inter Tight'; src: url('fonts/inter-tight-latin-wght-normal.woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter Tight', Arial, sans-serif; color: #fff; }
.art { width: 1280px; height: 640px; background: #061234 url('../checkpoint-hero.png') center/cover no-repeat; padding: 56px 64px; position: relative; overflow: hidden; }
.brand { display: flex; align-items: center; gap: 14px; font-size: 31px; font-weight: 600; letter-spacing: -1px; }
.brand img { width: 44px; height: 44px; }
.brand span { border-left: 1px solid #536079; padding-left: 16px; margin-left: 4px; font-family: 'Hiragino Mincho ProN', serif; font-size: 24px; font-weight: 500; color: #c5d5f3; }
.eyebrow { margin-top: 72px; color: #a8bcdf; font-size: 13px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
h1 { font-size: 76px; line-height: 1.05; letter-spacing: -2.5px; font-weight: 550; margin: 19px 0 23px; }
.pitch { color: #c5d5f3; font-size: 20px; line-height: 1.55; margin: 0; max-width: 490px; }
.foot { position: absolute; left: 64px; bottom: 43px; color: #a8bcdf; font-size: 14px; }
</style>
</head>
<body>
<div class="art" id="art">
<div class="brand"><img src="../logo.svg" alt="">Sekisho <span lang="ja">関所</span></div>
<div class="eyebrow">The agent payment checkpoint</div>
<h1>Before the<br>agent signs.</h1>
<p class="pitch">Screen the wallet. Apply the policy.<br>Record the decision.</p>
<div class="foot">x402 payments &nbsp; / &nbsp; Human review &nbsp; / &nbsp; Onchain evidence</div>
</div>
<script>if (location.hash === '#social') document.querySelector('.foot').textContent = 'github.com/MarcusC-ops/sekisho  ·  Testnet demo policy';</script>
</body>
</html>
