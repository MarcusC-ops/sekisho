[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sekisho-gate"
version = "0.1.0"
description = "Sekisho gate: compliance screening API for AI agent payments"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "sse-starlette",
    "pyyaml",
    "eth-account>=0.13",
    "web3>=7",
    "eth-utils",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.setuptools.packages.find]
include = ["sekisho_gate*"]
