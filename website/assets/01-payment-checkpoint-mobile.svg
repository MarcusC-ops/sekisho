<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1120" role="img" aria-labelledby="title desc"><title id="title">Sekisho mobile payment flow</title><desc id="desc">Payment request, wallet screening and policy, followed by one of allow, hold or block.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#191817"/></marker></defs><rect width="560" height="1120" fill="#F0EBE6"/><text x="48" y="85" fill="#191817" font-size="43" font-weight="700" font-family="Arial,Helvetica,sans-serif">Before your</text><text x="48" y="139" fill="#191817" font-size="43" font-weight="700" font-family="Arial,Helvetica,sans-serif">assistant pays</text><rect x="48" y="192" width="464" height="110" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="75" y="257" fill="#191817" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif">Your assistant requests payment</text><path d="M280 302 L280 350" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="364" width="464" height="176" rx="20" fill="#D8C7F1" stroke="#191817" stroke-width="2"/><text x="80" y="420" fill="#191817" font-size="39" font-weight="700" font-family="Arial,Helvetica,sans-serif">Sekisho</text><text x="80" y="467" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Checks wallet risk</text><text x="80" y="502" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Applies rules and keeps reasons</text><path d="M280 540 L280 583" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="596" width="464" height="110" rx="20" fill="#D8E8DD" stroke="#191817" stroke-width="2"/><text x="75" y="639" fill="#236247" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif">ALLOW</text><text x="75" y="677" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Payment can proceed</text><rect x="48" y="732" width="464" height="110" rx="20" fill="#F4E1AE" stroke="#191817" stroke-width="2"/><text x="75" y="775" fill="#77510D" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif">HOLD</text><text x="75" y="813" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Escrow + human review</text><rect x="48" y="868" width="464" height="110" rx="20" fill="#F2D4D4" stroke="#191817" stroke-width="2"/><text x="75" y="911" fill="#9D3435" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif">BLOCK</text><text x="75" y="949" fill="#191817" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">No payment signature</text><text x="48" y="1029" fill="#625E59" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Conceptual outcomes, not sequential steps.</text><text x="48" y="1059" fill="#625E59" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Missing evidence is never a clean result.</text></svg>