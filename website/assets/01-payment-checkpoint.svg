<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The Sekisho payment checkpoint</title><desc id="desc">An assistant requests a payment. Sekisho checks risk, applies rules and keeps the reasons. Allow proceeds, hold enters escrow and human review, block produces no payment signature.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#191817"/></marker></defs><rect width="1600" height="900" fill="#F0EBE6"/><text x="72" y="110" fill="#191817" font-size="58" font-weight="700" font-family="Arial,Helvetica,sans-serif">A checkpoint before your assistant pays</text><text x="74" y="169" fill="#625E59" font-size="30" font-weight="400" font-family="Arial,Helvetica,sans-serif">Example: an AI assistant wants to buy a five-cent report.</text><rect x="74" y="329" width="340" height="180" rx="20" fill="#FAF8F5" stroke="#191817" stroke-width="2"/><text x="108" y="395" fill="#191817" font-size="36" font-weight="700" font-family="Arial,Helvetica,sans-serif">Your assistant</text><text x="108" y="447" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">Requests a payment</text><text x="108" y="482.1" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">to a vendor’s wallet</text><path d="M414 419 L550 419" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="555" y="294" width="405" height="250" rx="20" fill="#D8C7F1" stroke="#191817" stroke-width="2"/><text x="593" y="359" fill="#191817" font-size="46" font-weight="700" font-family="Arial,Helvetica,sans-serif">Sekisho</text><text x="593" y="420" fill="#191817" font-size="30" font-weight="400" font-family="Arial,Helvetica,sans-serif">Checks wallet risk</text><text x="593" y="463" fill="#191817" font-size="30" font-weight="400" font-family="Arial,Helvetica,sans-serif">Applies your payment rules</text><text x="593" y="506" fill="#191817" font-size="30" font-weight="400" font-family="Arial,Helvetica,sans-serif">Keeps the reasons</text><path d="M960 419 H1040 V276 H1110" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M960 419 H1040 V467 H1110" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M960 419 H1040 V658 H1110" stroke="#191817" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1117" y="206" width="410" height="140" rx="20" fill="#D8E8DD" stroke="#191817" stroke-width="2"/><text x="1150" y="259" fill="#236247" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif">ALLOW</text><text x="1150" y="310" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">Payment can proceed</text><rect x="1117" y="397" width="410" height="140" rx="20" fill="#F4E1AE" stroke="#191817" stroke-width="2"/><text x="1150" y="450" fill="#77510D" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif">HOLD</text><text x="1150" y="501" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">Escrow + human review</text><rect x="1117" y="588" width="410" height="140" rx="20" fill="#F2D4D4" stroke="#191817" stroke-width="2"/><text x="1150" y="641" fill="#9D3435" font-size="35" font-weight="700" font-family="Arial,Helvetica,sans-serif">BLOCK</text><text x="1150" y="692" fill="#191817" font-size="27" font-weight="400" font-family="Arial,Helvetica,sans-serif">No payment signature</text><text x="74" y="751" fill="#191817" font-size="32" font-weight="700" font-family="Arial,Helvetica,sans-serif">Missing required evidence never counts as a clean result.</text><text x="74" y="828" fill="#625E59" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Conceptual product flow. HOLD is an application review state, not a statutory asset freeze.</text></svg>