name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Gate, SDK and agents (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m pytest -q

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge test -vv
        working-directory: contracts

  dashboard:
    name: Compliance Console (lint, build, hash vector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:hash

  agent-config:
    name: Agent config in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .agents/scripts/link-skills.sh check
      - run: .agents/scripts/sync-mcp.sh check
